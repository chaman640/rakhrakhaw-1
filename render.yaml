# Render ka blueprint — ek hi service me client + server.
#
# Render pe: New → Blueprint → apna repo chunein → Apply.
# Sirf MONGO_URI bharni padegi, baaki sab yahin se set ho jata hai.

services:
  - type: web
    name: rakhrakhav
    runtime: node
    plan: free
    region: singapore          # India ke sabse paas
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production

      # Node ka version pakka kar dete hain — Render ka default badalta rehta hai
      - key: NODE_VERSION
        value: "22"

      # Ye Render dashboard me khud bharni hai (MongoDB Atlas ka connection string).
      # sync:false ka matlab — ye value repo me nahi jayegi.
      - key: MONGO_URI
        sync: false

      # Render khud ek lamba random secret bana dega — kahin likhne ki zarurat nahi
      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 30d

      # Images ke liye — Render ki disk har deploy pe saaf ho jati hai,
      # isliye production me Cloudinary daalna zaroori hai (free plan kaafi hai).
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      - key: TZ
        value: Asia/Kolkata

      - key: BILLING_MODE
        value: free

      # OTP ka SMS (signup / forgot password) — bina iske OTP nahi jayega
      - key: SMS_PROVIDER
        value: apitxt
      - key: APITXT_API_KEY
        sync: false

      # Admin panel ka pehla login (baad me panel se password badal sakte hain)
      - key: PARTNER_ADMIN_EMAIL
        sync: false
      - key: PARTNER_ADMIN_PASSWORD
        sync: false

      # Phone notification — ek baar `npm run vapid --prefix server` se banayein
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false

      # CLIENT_URL / SERVER_URL jaan-boojh kar nahi diye —
      # ek hi URL wale deploy me app khud pata laga leta hai.
